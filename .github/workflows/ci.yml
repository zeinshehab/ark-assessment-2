# CI: every push and pull request is checked; only main and version tags publish an image.
#
#   checks   lint (ruff) -> tests (pytest, fakes only: no API keys, no quota) -> dependency audit (pip-audit)
#   image    docker build -> smoke test of the container as production runs it (scripts/smoke.sh)
#   publish  (main and v* tags) multi-arch image (amd64 + arm64) to GHCR, tagged with the commit SHA
#
# CI never sees a real API key: tests use dummy keys and fake providers, the smoke test uses dummy secrets.
# Actions are pinned to full commit SHAs (a tag can be moved by whoever controls the action's repo);
# Dependabot keeps the pins current.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and static checks (ruff, incl. bandit security rules)
        run: uv run ruff check .
      - name: Tests (fake providers, real sandbox and MCP server)
        run: uv run pytest -q
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.lock.txt
          uv run pip-audit -r requirements.lock.txt --require-hashes --disable-pip --progress-spinner off

  image:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: crosscheck:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container (production mode, dummy secrets)
        run: bash scripts/smoke.sh crosscheck:ci

  publish:
    if: github.event_name == 'push'   # main or a v* tag; never pull requests
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                  # push to GHCR with the workflow's own short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64 for servers, arm64 for Apple Silicon)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.short.outputs.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - name: Summary
        run: |
          {
            echo "### Published"
            echo "Deploy with: \`./deploy/deploy.sh ${{ steps.short.outputs.sha }}\`"
            echo
            echo '${{ steps.meta.outputs.tags }}'
          } >> "$GITHUB_STEP_SUMMARY"
