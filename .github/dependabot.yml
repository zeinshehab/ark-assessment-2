# Weekly pull requests for outdated or vulnerable dependencies. Each one goes through the full CI pipeline
# (lint, tests, audit, image build, smoke test) before anyone merges it.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml + uv.lock
    directory: /
    schedule: {interval: weekly}
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker        # the digest-pinned base images in the Dockerfile
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose  # cloudflared in deploy/compose.yaml
    directory: /deploy
    schedule: {interval: weekly}
  - package-ecosystem: github-actions  # the SHA-pinned actions in .github/workflows
    directory: /
    schedule: {interval: weekly}
