[project]
name = "code-review-orchestrator"
version = "3.0.0"
description = "Multi-model code review orchestrator: Groq generates, Gemini reviews through our MCP server."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic>=2.14",
    "pydantic-settings>=2.11",
    "python-dotenv>=1.2",
    "prometheus-client>=0.23",
    "pyjwt[crypto]>=2.10",
    "defusedxml>=0.7",
    "mcp>=2.3,<3",
    "groq>=1.7",
    "google-genai>=3.6",
    # ruff and pytest are runtime dependencies: the MCP tools run them on generated code
    "ruff>=0.17",
    "pytest>=9.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pip-audit>=2.9",
]

[tool.uv]
package = false   # an application, not a library: nothing to build or publish to PyPI

[tool.ruff]
line-length = 120
target-version = "py313"
# Benchmark task folders are fixtures: buggy.py is deliberately wrong and the hidden tests
# deliberately use pytest.raises(Exception) so any exception type counts.
extend-exclude = ["benchmark/tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    "S603",  # subprocess calls are intentional (sandbox, ruff) and use fixed argument lists
    "S607",  # partial executable path: we call sys.executable / ruff from the venv
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts and dummy secrets are expected in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
